[project]
name = "ragsaas-backend"
version = "0.1.0"
description = "Multi-tenant RAG SaaS backend"
requires-python = ">=3.11"

dependencies = [
    # --- Web / config / DB (Phase 0) ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",

    # --- Local models (Phase 1) ---
    # Pulls torch + transformers: ~2GB installed, the heaviest thing here.
    # Provides both the bge-small embedder and the bge-reranker cross-encoder,
    # plus the tokenizer that makes chunking token-aware against the real
    # 512-token model limit (so no separate tiktoken, whose BPE would count
    # different tokens than the model we actually run).
    "sentence-transformers>=3.3.0",

    # --- Vector store (Phase 1) ---
    "qdrant-client>=1.12.0",

    # --- LLM vendor SDKs (Phase 1) ---
    # Imported ONLY inside app/providers/llm/ — Hard Rule #2.
    "google-genai>=0.3.0", # Gemini: the current unified SDK
    "groq>=0.13.0",        # free-tier fallback
    # Ollama needs no SDK — it is a plain HTTP API, and httpx below covers it.
    # One less vendor dependency for the offline path.

    # --- Document parsing (Phase 1 ingestion) ---
    "pypdf>=5.1.0",       # PDF text extraction, pure Python
    "python-docx>=1.1.2", # .docx

    # --- Async ingestion (Phase 2) ---
    # The [redis] extra brings the redis client Celery uses as its broker.
    # Redis is already in docker-compose for this purpose.
    "celery[redis]>=5.4.0",

    # Multipart form parsing. Required by Starlette for `UploadFile` — without
    # it the documents router fails at import, not at request time.
    "python-multipart>=0.0.20",

    # --- Auth (Phase 2) ---
    # Clerk signs session tokens with RS256 and publishes the public keys as a
    # JWKS document, so we only ever verify — no shared secret lives here. The
    # [crypto] extra pulls `cryptography`, which provides the RSA verification
    # PyJWT itself does not implement.
    "pyjwt[crypto]>=2.9.0",

    # --- HTTP (Phase 1) ---
    # Async client for Ollama; also what FastAPI's TestClient uses under the
    # hood, so it is a runtime dep rather than dev-only.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # httpx moved to the main dependencies in Phase 1 (Ollama provider).
    "ruff>=0.8.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear (real footguns),
# UP pyupgrade (modern syntax), N naming conventions.
select = ["E", "W", "F", "I", "B", "UP", "N"]
ignore = ["E501"] # black already enforces line length

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
