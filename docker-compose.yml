# Dev infrastructure only. The FastAPI app and Celery worker run on the host
# during development so reload/debugging stay fast; they get containerized in
# Phase 7 for the Oracle ARM box.
#
#   docker compose up -d      start
#   docker compose ps         status
#   docker compose down       stop (data survives in named volumes)
#   docker compose down -v    stop AND wipe all data

services:
  postgres:
    image: postgres:16-alpine
    container_name: ragsaas-postgres
    environment:
      POSTGRES_USER: ragsaas
      POSTGRES_PASSWORD: ragsaas # local dev only; production uses Neon
      POSTGRES_DB: ragsaas
    ports:
      # Host 5433, not 5432: a natively-installed Windows PostgreSQL service
      # already holds 5432. Windows lets a second process bind the same port
      # instead of erroring, so the conflict is silent — connections just reach
      # the wrong server. Only the host side moves; inside the container and
      # inside the compose network, Postgres is still on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 only once the server accepts connections, so
      # `docker compose up --wait` blocks until migrations can actually run.
      test: ["CMD-SHELL", "pg_isready -U ragsaas -d ragsaas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ragsaas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ragsaas-qdrant
    ports:
      - "6333:6333" # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget, so probe the port from the shell's
      # own /dev/tcp instead of adding a dependency to the image.
      test:
        ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
